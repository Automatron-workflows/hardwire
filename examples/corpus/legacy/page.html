<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Account</title></head>
<body>
  <h1>Your profile</h1>
  <!-- Common legacy markup: no action attribute, bracket field names. -->
  <form id="profile" method="post">
    <label>Full name <input name="user[name]" type="text" required></label>
    <label>Email <input name="email" type="email" required></label>
    <button type="submit">Save</button>
  </form>
</body>
</html>
