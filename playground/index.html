<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Move a day of meetings through typed actions. Preview the changes, approve them and watch the calendar update.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Hardwire | Try it</title>
  <link rel="stylesheet" href="./styles.css?v=calendar-1">
  <script type="module" src="./app.mjs?v=calendar-1"></script>
</head>
<body>
  <header><a href="./" aria-label="Hardwire home">hardwire</a></header>
  <main>
    <h1>Agentic actions.<br><span>Without the clicks.</span></h1>
    <section class="journey" aria-label="Interactive demo calendar">
      <button id="request" class="request" type="button" disabled>
        <span id="request-label">Move Friday’s meetings to Monday</span>
        <span class="send" aria-hidden="true"><svg viewBox="0 0 24 24"><path id="send-path" d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
      <div class="calendar" id="calendar">
        <div class="calendar-head"><span id="calendar-day">Friday</span><span id="calendar-caption">Demo calendar</span></div>
        <ol id="meetings" aria-label="Calendar meetings"></ol>
        <div class="calendar-foot"><p id="status" role="status" aria-live="polite">Loading calendar…</p><button id="secondary" type="button" hidden>Cancel</button></div>
      </div>
      <details id="details" hidden>
        <summary>See the actions</summary>
        <div class="technical"><p id="discovery"></p><ol id="action-log"></ol><details><summary>Contract and call data</summary><pre id="record"></pre></details></div>
      </details>
    </section>
  </main>
  <footer><span>Scripted agent · local demo · no account connected</span><a href="https://github.com/Automatron-workflows/hardwire">GitHub ↗</a></footer>
  <noscript><p class="no-script">Enable JavaScript to try the calendar.</p></noscript>
</body>
</html>
