name: prepare-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require a chosen reuse license
        run: node -e "const p=require('./package.json'); if(!p.license || p.license==='UNLICENSED') throw new Error('Owner must choose a reuse license before release');"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run release:prepare
      - name: Create a draft experimental GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" output/release/*.tgz output/release/SHA256SUMS --target "$GITHUB_SHA" --title "Hardwire $version — local MCP toolkit" --notes-file "docs/releases/v$version.md" --prerelease --draft
      - name: Verify the uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          download="$RUNNER_TEMP/hardwire-release-download"
          mkdir -p "$download"
          gh release download "v$version" --dir "$download" --pattern '*.tgz' --pattern SHA256SUMS
          (cd "$download" && sha256sum --check SHA256SUMS)
          npm run test:package -- "$download/hardwire-$version.tgz"
