name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # No install step: the package has no dependencies by design.
      - run: node --test test/*.test.mjs
      - run: node src/cli.mjs validate examples/example-panel.json
      - run: node src/cli.mjs audit examples/example-panel.json
